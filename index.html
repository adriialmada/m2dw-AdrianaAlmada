<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tablas</title>
    <style>
        table, tr, td, th{
            border: solid  1px pink;
        }
    </style>
</head>
<body>
    <h1>Tablas en html</h1>
    <hr>
    <table> <!-- table row-->
        <th>Nro.</th> <!--table head-->
        <th>Nombre</th>
        <th>Apellido</th>
    </tr>
    <tr>
        <td>1</td>
        <td>Adriana</td>
        <td>Almada</td>
        </tr>    
        <tr>
            <td>2</td>
            <td>Giuliana</td>
            <td>Liso</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Cesar</td>
            <td>Peralta</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Santiago</td>
            <td>Matta</td>
        </tr>
        <tr>
            <td>5</td>
            <td>Edgar</td>
            <td>Rodriguez</td>
        </tr>
    </table>
    <hr>
    <form action="#">
        <fieldset>
            <legend>INPUT  DE TIPO  TEXTO</legend>
            <label for="inNombre">Nombre:</label>
            <input  type="text" placeholder="ingresa tu nombre..."> <br>
            <label for="inApellido">Apellido:</label>
            <input  type="text" placeholder="ingresa tu apellido..."> <br>
            <button type="submit">BOTON</button> <br>
            <label for="inPassword">Password:</label>
            <input type="password" id="inPassword" <br>
            <label for="inEmail">Email:</label>
            <input type="email" id="inEmail" placeholder="Ingresa tu email..."> <br>
            <label for="inNumero">Numero:</label>
            <input type="number" id="inNumero"> <br>
            <label for="">Sexo</label> <br>
            <input type="radio"> <span>Masculino</span> <br>
            <input type="radio"> <span>Femenino</span> <br>
            <label for="">colores favoritos</label> <br>
            <input type="checkbox" <span>Rojo</span> <br>
            <input type="checkbox" <span>Azul</span> <br>
            <input type="checkbox" <span>Negro</span> <br>

            <input type="submit" value="Click para enviar"> <br>
            <input type="button" value="Enviar!"> <br>

            <input type="file"> <br>
            
            <input  type="color"><br>
            <input  type="search"><br>
            <input  type="url"><br>
            <input  type="tel"><br>
            <input type="date"> <br>
            <input type="date"><br>
            <input type="datetime-local"><br>
            <input type="week"><br>
            <input type="month"><br>
            <textarea cols="20" rows="5"></textarea> <br>
            <select>
           <option value="">--Selecciona un lenguaje--</option>
           <option value="HTML">HTML</option>
           <option  value="CSS">CSS</option>
           <option value="JAVASCRIPT">JAVASCRIPT</option>
           <option value="PHP">PHP</option>
            </select>
            


        </fieldset>
    </form>
</body>
</html>
